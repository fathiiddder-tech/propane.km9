<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAZAKI KM9 - AFRIQUIAGAZ TRACKER</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
font-family:Segoe UI;
}

.header{
background:#003c8f;
color:white;
padding:15px;
}

.card{
box-shadow:0 3px 10px rgba(0,0,0,.1);
border:none;
}

.hidden{
display:none;
}

.critical{
color:red;
font-weight:bold;
}

.warning{
color:orange;
font-weight:bold;
}

.normal{
color:green;
font-weight:bold;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div class="container" id="loginPage">

<div class="row justify-content-center mt-5">

<div class="col-md-5">

<div class="card">

<div class="card-body">

<h2 class="text-center">YAZAKI KM9</h2>

<h5 class="text-center text-primary">
AFRIQUIAGAZ TRACKER
</h5>

<hr>

<label>Identifiant</label>

<input
type="text"
id="username"
class="form-control mb-3">

<label>Mot de passe</label>

<input
type="password"
id="password"
class="form-control mb-3">

<button
class="btn btn-primary w-100"
onclick="login()">

Connexion

</button>

<div id="loginError" class="text-danger mt-3"></div>

</div>

</div>

</div>

</div>

</div>

<!-- DASHBOARD -->

<div id="app" class="hidden">

<div class="header">

<div class="d-flex justify-content-between">

<h3>YAZAKI KM9</h3>

<h3>AFRIQUIAGAZ</h3>

</div>

</div>

<div class="container mt-4">

<div class="row">

<div class="col-md-3">

<div class="card p-3">

<h6>Niveau Actuel</h6>

<h1 id="currentLevel">35%</h1>

</div>

</div>

<div class="col-md-3">

<div class="card p-3">

<h6>Seuil Critique</h6>

<h1 id="criticalLevel">30%</h1>

</div>

</div>

<div class="col-md-3">

<div class="card p-3">

<h6>Rôle</h6>

<h1 id="role"></h1>

</div>

</div>

<div class="col-md-3">

<div class="card p-3">

<h6>Autonomie</h6>

<h1>12 J</h1>

</div>

</div>

</div>

<div class="mt-4" id="alertZone"></div>

<div class="row mt-4">

<!-- NIVEAU -->

<div class="col-md-6">

<div class="card p-4">

<h4>Niveau Cuve</h4>

<input
type="number"
id="newLevel"
class="form-control"
placeholder="Nouveau Niveau %">

<button
class="btn btn-success mt-3"
onclick="updateLevel()">

Mettre à jour

</button>

</div>

</div>

<!-- COMMANDE -->

<div class="col-md-6">

<div class="card p-4">

<h4>Commande Gaz</h4>

<button
class="btn btn-danger"
onclick="generateMail()">

Générer commande

</button>

</div>

</div>

</div>

<!-- LIVRAISON -->

<div class="card mt-4 p-4">

<h4>Nouvelle Livraison</h4>

<div class="row">

<div class="col-md-3">
<input class="form-control" placeholder="N° commande">
</div>

<div class="col-md-3">
<input type="date" class="form-control">
</div>

<div class="col-md-3">

<select class="form-control">

<option>FATHI IDDAR</option>
<option>DRIOUICH CHLIH</option>
<option>FRAKECH MOHAMMED</option>
<option>ABDELLATIF SABIR</option>

</select>

</div>

<div class="col-md-3">
<input type="file" class="form-control">
</div>

</div>

</div>

<!-- PARAMETRES -->

<div
class="card p-4 mt-4"
id="settingsPanel">

<h4>Paramètres (ADMIN)</h4>

<div class="row">

<div class="col-md-4">

<label>Seuil critique</label>

<input
id="criticalInput"
type="number"
value="30"
class="form-control">

</div>

<div class="col-md-4">

<label>Email fournisseur</label>

<input
id="supplierMail"
value="afriquiagaz@akwagroup.com"
class="form-control">

</div>

<div class="col-md-4">

<label>Code Client</label>

<input
id="clientCode"
value="26920"
class="form-control">

</div>

</div>

<button
class="btn btn-primary mt-3"
onclick="saveSettings()">

Enregistrer

</button>

</div>

<!-- HISTORIQUE -->

<div class="card p-4 mt-4">

<h4>Historique</h4>

<table class="table">

<thead>

<tr>

<th>Date</th>
<th>Niveau</th>
<th>Utilisateur</th>

</tr>

</thead>

<tbody id="historyTable">

<tr>

<td>21/10/2026</td>
<td>35%</td>
<td>TECHNIQUE</td>

</tr>

</tbody>

</table>

</div>

<button
class="btn btn-dark mt-4"
onclick="logout()">

Déconnexion

</button>

</div>

</div>

<script>

let currentRole="";
let criticalLevel=30;

function login(){

let user=
document.getElementById("username").value;

let pass=
document.getElementById("password").value;

/* ADMIN */

if(
user==="admin" &&
pass==="YazakiKM9@2026"
){

currentRole="ADMIN";

startApp();

return;
}

/* TECHNIQUE */

if(
user==="technique" &&
pass==="GazTech@2026"
){

currentRole="TECHNIQUE";

startApp();

return;
}

document.getElementById("loginError")
.innerHTML="Identifiant ou mot de passe incorrect";

}

function startApp(){

document.getElementById("loginPage")
.style.display="none";

document.getElementById("app")
.style.display="block";

document.getElementById("role")
.innerHTML=currentRole;

if(currentRole==="TECHNIQUE"){

document.getElementById("settingsPanel")
.style.display="none";

}

checkAlert();

}

function updateLevel(){

let level=
document.getElementById("newLevel").value;

if(level==="") return;

document.getElementById("currentLevel")
.innerHTML=level+"%";

document.getElementById("historyTable")
.innerHTML+=`
<tr>
<td>${new Date().toLocaleDateString()}</td>
<td>${level}%</td>
<td>${currentRole}</td>
</tr>
`;

checkAlert();

}

function checkAlert(){

let level=parseInt(
document.getElementById("currentLevel").innerText
);

if(level<=criticalLevel){

document.getElementById("alertZone")
.innerHTML=
`
<div class="alert alert-danger">

SEUIL CRITIQUE ATTEINT

<br>

Niveau actuel : ${level} %

<br><br>

<button
class="btn btn-danger"
onclick="generateMail()">

Commander maintenant

</button>

</div>
`;
}
else{

document.getElementById("alertZone")
.innerHTML=
`
<div class="alert alert-success">

Niveau normal

</div>
`;
}

}

function generateMail(){

let niveau=
document.getElementById("currentLevel")
.innerText;

let email=
document.getElementById("supplierMail").value;

let codeClient=
document.getElementById("clientCode").value;

let sujet=
"Commande de gaz – Niveau critique atteint";

let message=`

Salam,

Je vous prie de bien vouloir procéder à l’approvisionnement en gaz dans les plus brefs délais.

En effet, le niveau actuel de la cuve a atteint le seuil critique de 30 %, ce qui nécessite une intervention rapide afin d’éviter tout risque de rupture d’approvisionnement et d’assurer la continuité de nos activités.

Code client : ${codeClient}

Niveau actuel : ${niveau}

Je vous remercie de prendre en compte cette demande et de nous communiquer la date prévue de livraison.

Cordialement,

YAZAKI KM9

`;

window.location.href=
`mailto:${email}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(message)}`;

}

function saveSettings(){

criticalLevel=
document.getElementById("criticalInput").value;

alert("Paramètres enregistrés");

checkAlert();

}

function logout(){

location.reload();

}

</script>

</body>
</html>
